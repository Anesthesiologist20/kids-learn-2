<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6956cf"><title>نجومي وتقدمي | Kids Learn 2</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5ff;color:#2b3052;font:17px/1.7 system-ui,-apple-system,sans-serif}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:18px 0 40px}a{color:#6551c4}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.hero{background:linear-gradient(120deg,#6e56cc,#479ddd);color:white;border-radius:24px;padding:28px}.hero h1{margin:0 0 7px;font-size:clamp(25px,5vw,40px)}.hero p{margin:0}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.tabs button{border:2px solid #e2def4;border-radius:13px;background:white;padding:10px 18px;min-height:48px;font:inherit;font-weight:800;color:#555e83}.tabs button[aria-pressed=true]{background:#6551c4;color:white;border-color:#6551c4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:white;border-radius:18px;text-align:center;padding:16px 7px;box-shadow:0 5px 20px #28345210}.stat strong{display:block;font-size:clamp(25px,5vw,39px);color:#6e54cb}.stat small{color:#6b728c}.panel{background:white;border-radius:20px;padding:22px;margin-top:17px}.panel h2{margin:0 0 10px;font-size:21px}.meter{height:14px;background:#e9e6fa;border-radius:30px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#6c55d1,#48b9a5);width:0}.muted{color:#727991}.mistake{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e9eaf4;direction:ltr;text-align:left}.btn{display:inline-block;border-radius:12px;background:#6753cc;color:white;text-decoration:none;padding:11px 18px;font-weight:800}.note{font-size:13px;color:#69718d;margin-top:17px}@media(max-width:450px){.stats{gap:6px}.stat{padding:12px 4px}.stat small{font-size:11px}}</style></head><body><main class="wrap"><header><strong>🏆 Kids Learn 2</strong><a href="./">الرئيسية ←</a></header><section class="hero"><h1>نجومي وتقدمي ⭐</h1><p>تعلّم، العب، وراجع أخطاءك!</p></section><nav class="tabs" aria-label="اختيار الطفل"><button data-child="sakinah">👧🏻 سكينة</button><button data-child="aboud">👦🏻 عبود</button><button data-child="raghd">👧🏽 رغد</button></nav><div class="stats"><div class="stat"><strong id="stars">0</strong><small>⭐ نجمة</small></div><div class="stat"><strong id="right">0</strong><small>✅ صحيح</small></div><div class="stat"><strong id="done">0</strong><small>🏅 تحديات</small></div></div><section class="panel"><h2>🎯 دقة الإجابات</h2><div class="meter"><div class="fill" id="fill"></div></div><p id="accuracy" class="muted">ابدأ أول تحدٍ!</p></section><section class="panel"><h2>🧠 راجع أخطاءك</h2><div id="mistakes" class="muted">لا توجد أخطاء مسجلة. ممتاز!</div></section><section class="panel"><h2>🚀 تابع التعلّم</h2><a class="btn" id="continue" href="sakinah/irregular-verbs/">افتح الدروس ←</a></section><p class="note">🔒 النتائج محفوظة على هذا الجهاز والمتصفح فقط. مسح بيانات الموقع يحذفها. لا توجد مزامنة سحابية.</p></main><script src="assets/progress.js"></script><script>(function(){const names={sakinah:"sakinah/",aboud:"aboud/",raghd:"raghd/"};let child=new URLSearchParams(location.search).get("child");if(!names[child])child="sakinah";function draw(){document.querySelectorAll("[data-child]").forEach(b=>{b.setAttribute("aria-pressed",String(b.dataset.child===child));b.onclick=()=>{child=b.dataset.child;history.replaceState(null,"","?child="+child);draw()}});const d=KidsProgress.read(child),pct=d.attempts?Math.round(d.correct/d.attempts*100):0;document.getElementById("stars").textContent=d.stars;document.getElementById("right").textContent=d.correct;document.getElementById("done").textContent=d.completed;document.getElementById("fill").style.width=pct+"%";document.getElementById("accuracy").textContent=d.attempts?pct+"% · "+d.attempts+" answers":"ابدأ أول تحدٍ!";const mistakes=KidsProgress.review(child),el=document.getElementById("mistakes");el.replaceChildren();if(!mistakes.length)el.textContent="لا توجد أخطاء مسجلة. ممتاز!";else mistakes.forEach(m=>{const row=document.createElement("div");row.className="mistake";const t=document.createElement("span");t.textContent=m.question;const n=document.createElement("strong");n.textContent="×"+m.count;row.append(t,n);el.append(row)});document.getElementById("continue").href=child==="sakinah"?"sakinah/irregular-verbs/":names[child]}draw()})();</script></body></html>
